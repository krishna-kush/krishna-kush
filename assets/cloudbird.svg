<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <clipPath id="frame"><rect width="420" height="260" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .star { animation: tw 3s ease-in-out infinite; }
    .d1 { animation-delay: 1s; } .d2 { animation-delay: 2s; }
    @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    .drift { animation: drift 24s linear infinite; }
    @keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(480px); } }
    .fly { animation: fly 9s linear infinite; }
    @keyframes fly { from { transform: translateX(-80px); } to { transform: translateX(500px); } }
    .bob { animation: bob 1.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    .wing { transform-box: fill-box; transform-origin: bottom center; animation: flap .32s ease-in-out infinite alternate; }
    @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.7); } }
    .led { animation: tw 1s ease-in-out infinite; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="420" height="260" fill="url(#sky)"/>
    <g fill="#ffffff">
      <circle class="star" cx="30" cy="30" r="1.3"/>
      <circle class="star d1" cx="380" cy="24" r="1.5"/>
      <circle class="star d2" cx="340" cy="110" r="1"/>
      <circle class="star d1" cx="60" cy="120" r="1"/>
    </g>

    <g class="drift" fill="#16304a" opacity=".7">
      <circle cx="20" cy="140" r="12"/><circle cx="36" cy="134" r="16"/><circle cx="54" cy="142" r="11"/>
    </g>

    <!-- The open cloud -->
    <g fill="#16304a" stroke="#38bdf8" stroke-width="2">
      <circle cx="160" cy="72" r="28"/>
      <circle cx="196" cy="56" r="36"/>
      <circle cx="236" cy="64" r="32"/>
      <circle cx="268" cy="80" r="22"/>
    </g>
    <rect x="140" y="70" width="140" height="34" rx="17" fill="#16304a"/>
    <path d="M150 104 h116" stroke="#38bdf8" stroke-width="2"/>
    <text x="210" y="86" font-size="13" font-weight="800" fill="#38bdf8" text-anchor="middle">OPEN CLOUD</text>

    <!-- Machines lending power -->
    <g stroke="#e6e6e6" stroke-width="2" fill="#141414">
      <rect x="52" y="200" width="40" height="24" rx="3"/>
      <rect x="190" y="200" width="40" height="24" rx="3"/>
      <rect x="328" y="200" width="40" height="24" rx="3"/>
    </g>
    <g stroke="#e6e6e6" stroke-width="2">
      <line x1="44" y1="228" x2="100" y2="228"/>
      <line x1="182" y1="228" x2="238" y2="228"/>
      <line x1="320" y1="228" x2="376" y2="228"/>
    </g>
    <g font-size="10" fill="#6b6b6b" text-anchor="middle">
      <text x="72" y="246">you</text>
      <text x="210" y="246">your friend</text>
      <text x="348" y="246">a stranger</text>
    </g>
    <g fill="#38bdf8">
      <circle r="3"><animateMotion dur="2.4s" repeatCount="indefinite" path="M72 198 Q 110 150 170 104"/></circle>
      <circle r="3"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M210 198 L 210 108"/></circle>
      <circle r="3"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M348 198 Q 310 150 252 104"/></circle>
    </g>

    <!-- The bird, carrying a server -->
    <g transform="translate(0 134)">
      <g class="fly">
        <g class="bob">
          <line x1="-6" y1="10" x2="-10" y2="28" stroke="#9a9a9a" stroke-width="1.5"/>
          <line x1="6" y1="10" x2="8" y2="28" stroke="#9a9a9a" stroke-width="1.5"/>
          <rect x="-18" y="28" width="32" height="20" rx="3" fill="#141414" stroke="#e6e6e6" stroke-width="1.5"/>
          <circle class="led" cx="-11" cy="38" r="2" fill="#f02038"/>
          <circle class="led d1" cx="-4" cy="38" r="2" fill="#ffb800"/>
          <circle class="led d2" cx="3" cy="38" r="2" fill="#38bdf8"/>
          <polygon points="-16,-2 -30,-10 -27,5" fill="#0ea5e9"/>
          <ellipse cx="0" cy="0" rx="18" ry="12" fill="#38bdf8"/>
          <circle cx="16" cy="-6" r="9" fill="#38bdf8"/>
          <circle cx="19" cy="-8" r="2" fill="#0a0a0a"/>
          <polygon points="24,-7 33,-4 24,-1" fill="#ffb800"/>
          <path class="wing" d="M-8 -4 Q 0 -32 12 -4 Z" fill="#7dd3fc"/>
        </g>
      </g>
    </g>
  </g>
</svg>
