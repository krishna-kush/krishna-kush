<svg xmlns="http://www.w3.org/2000/svg" width="420" height="580" viewBox="0 0 420 580">
  <defs><clipPath id="out"><rect x="0" y="14" width="420" height="566"/></clipPath></defs>
  <style>
    text { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace; }
