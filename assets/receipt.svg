      <text x="210" y="60" font-size="22" font-weight="800" fill="#1a1a1a" text-anchor="middle">KRISHNA &amp; CO.</text><text x="210" y="84" font-size="11" fill="#6b6b6b" text-anchor="middle">makers of things that shouldn't work</text><line x1="60" y1="104" x2="360" y2="104" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="60" y="128" font-size="11" fill="#6b6b6b">TABLE 1</text><text x="360" y="128" font-size="11" fill="#6b6b6b" text-anchor="end">OPEN 24/7</text><line x1="60" y1="148" x2="360" y2="148" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="60" y="178" font-size="13" fill="#1a1a1a">1x phone that codes</text><text x="360" y="178" font-size="13" fill="#1a1a1a" text-anchor="end">phonecando.app</text><text x="60" y="196" font-size="11" fill="#6b6b6b" xml:space="preserve">   no PC needed. asks for coffee.</text><text x="60" y="226" font-size="13" fill="#1a1a1a">1x file that blows up</text><text x="360" y="226" font-size="13" fill="#1a1a1a" text-anchor="end">tarf.app</text><text x="60" y="244" font-size="11" fill="#6b6b6b" xml:space="preserve">   steal it and it's gone.</text><text x="60" y="274" font-size="13" fill="#1a1a1a">1x cloud with wings</text><text x="360" y="274" font-size="13" fill="#1a1a1a" text-anchor="end">cloudbird.app</text><text x="60" y="292" font-size="11" fill="#6b6b6b" xml:space="preserve">   your machine + mine = ours.</text><line x1="60" y1="316" x2="360" y2="316" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="60" y="340" font-size="13" fill="#1a1a1a">coffee</text><text x="360" y="340" font-size="13" fill="#1a1a1a" text-anchor="end">∞</text><text x="60" y="360" font-size="13" fill="#1a1a1a">sleep</text><text x="360" y="360" font-size="13" fill="#1a1a1a" text-anchor="end">0.3%</text><text x="60" y="380" font-size="13" fill="#1a1a1a">bugs</text><text x="360" y="380" font-size="13" fill="#1a1a1a" text-anchor="end">some</text><line x1="60" y1="400" x2="360" y2="400" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="60" y="430" font-size="16" fill="#1a1a1a" font-weight="800">TOTAL</text><text x="360" y="430" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="800">your idea?</text><line x1="60" y1="450" x2="360" y2="450" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 4"/><g fill="#1a1a1a"><rect x="96" y="470" width="3" height="40"/><rect x="101" y="470" width="4" height="40"/><rect x="109" y="470" width="2" height="40"/><rect x="113" y="470" width="6" height="40"/><rect x="121" y="470" width="3" height="40"/><rect x="128" y="470" width="2" height="40"/><rect x="134" y="470" width="2" height="40"/><rect x="138" y="470" width="2" height="40"/><rect x="143" y="470" width="4" height="40"/><rect x="149" y="470" width="2" height="40"/><rect x="153" y="470" width="6" height="40"/><rect x="162" y="470" width="2" height="40"/><rect x="168" y="470" width="2" height="40"/><rect x="172" y="470" width="6" height="40"/><rect x="180" y="470" width="6" height="40"/><rect x="190" y="470" width="4" height="40"/><rect x="196" y="470" width="2" height="40"/><rect x="200" y="470" width="6" height="40"/><rect x="208" y="470" width="3" height="40"/><rect x="214" y="470" width="2" height="40"/><rect x="220" y="470" width="2" height="40"/><rect x="226" y="470" width="3" height="40"/><rect x="233" y="470" width="2" height="40"/><rect x="237" y="470" width="6" height="40"/><rect x="247" y="470" width="2" height="40"/><rect x="252" y="470" width="2" height="40"/><rect x="258" y="470" width="2" height="40"/><rect x="264" y="470" width="2" height="40"/><rect x="270" y="470" width="2" height="40"/><rect x="275" y="470" width="6" height="40"/><rect x="284" y="470" width="3" height="40"/><rect x="290" y="470" width="6" height="40"/><rect x="299" y="470" width="3" height="40"/><rect x="305" y="470" width="2" height="40"/><rect x="309" y="470" width="2" height="40"/><rect x="313" y="470" width="6" height="40"/><rect x="322" y="470" width="6" height="40"/></g><text x="210" y="532" font-size="11" fill="#1a1a1a" text-anchor="middle">thank you, come build again</text>
      <g transform="rotate(-10 210 360)"><g class="stamp">
